[project]
name = "dana"
version = "0.1.0"
description = "Multi-tenant voice receptionist. Self-hosted cascade: SIP -> STT -> LLM -> TTS."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[silero,turn-detector,deepgram,openai,elevenlabs]~=1.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dana"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
