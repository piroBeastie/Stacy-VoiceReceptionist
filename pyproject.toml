[project]
name = "dana"
version = "0.1.0"
description = "Multi-tenant voice receptionist. Self-hosted cascade: SIP -> STT -> LLM -> TTS."
requires-python = ">=3.11"
dependencies = [
    # Pinned to the line every surface in this repo was actually verified
    # against, not to the widest range that happens to import. LiveKit Cloud
    # also refuses to deploy anything declaring a floor below 1.2.
    "livekit-agents[silero,turn-detector,deepgram,openai,elevenlabs,anthropic]~=1.8",
    # anthropic 1.x moved to httpx2 while livekit-plugins-anthropic 1.8 still
    # hands it an httpx.AsyncClient, so an unpinned install raises TypeError
    # the first time the LLM is constructed -- which is during a call.
    "anthropic<1.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # zoneinfo has no bundled database. Every appointment time, every "are we
    # open right now" check and every spoken date goes through
    # ZoneInfo(tenant.timezone), so without this the worker raises on the first
    # call on Windows and on any slim container. It passed locally only because
    # the ambient interpreter happened to have it.
    "tzdata",
    # Post-call webhook transport. Arrives transitively via livekit-agents
    # today; pinned here because delivery must not depend on that staying true.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dana"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
