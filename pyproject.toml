[project]
name = "stacy"
version = "0.1.0"
description = "Multi-tenant voice receptionist. Self-hosted cascade: SIP -> STT -> LLM -> TTS."
requires-python = ">=3.11"
dependencies = [
    # Pinned to the line every surface in this repo was actually verified
    # against, not to the widest range that happens to import. LiveKit Cloud
    # also refuses to deploy anything declaring a floor below 1.2.
    "livekit-agents[silero,turn-detector,deepgram,openai,elevenlabs,anthropic]~=1.8",
    # anthropic 1.x moved to httpx2 while livekit-plugins-anthropic 1.8 still
    # hands it an httpx.AsyncClient, so an unpinned install raises TypeError
    # the first time the LLM is constructed -- which is during a call.
    "anthropic<1.0",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # zoneinfo has no bundled database. Every appointment time, every "are we
    # open right now" check and every spoken date goes through
    # ZoneInfo(tenant.timezone), so without this the worker raises on the first
    # call on Windows and on any slim container. It passed locally only because
    # the ambient interpreter happened to have it.
    "tzdata",
    # Background voice cancellation. Without it a second voice in the caller's
    # room is transcribed, endpointed and answered exactly as the caller is.
    "livekit-plugins-noise-cancellation~=0.2",
    # Post-call webhook transport. Arrives transitively via livekit-agents
    # today; pinned here because delivery must not depend on that staying true.
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stacy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# 100 was the target and 49 lines in src never met it: the day/window regexes
# and the word tables read worse broken across lines than they do long.
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "UP", "B", "SIM", "C4", "DTZ", "RUF"]
ignore = [
    # "yes yeah yep sure".split() is how the word sets stay readable, and they
    # are read far more often than they are edited.
    "SIM905",
    # Em dashes and curly quotes in these strings are deliberate: most of them
    # are spoken aloud, and the voice reads the typography.
    "RUF001",
    # The `noqa` comments carry a reason, and several name rules this config
    # does not enforce (PLC0415 for the deliberate lazy imports, BLE001 for the
    # catch-alls that keep a call alive). They are documentation, not leftovers.
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# The tests quote whole spoken lines -- read-backs, the consent script -- and
# breaking those across lines hides what is being asserted.
"tests/*" = ["E501"]
